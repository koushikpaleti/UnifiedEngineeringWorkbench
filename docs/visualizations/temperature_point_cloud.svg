<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700">
<rect width="1100" height="700" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#172554} .t{font-size:28px;font-weight:bold} .s{font-size:15px;fill:#475569} .a{font-size:14px;fill:#334155} .grid{stroke:#cbd5e1;stroke-width:1} .axis{stroke:#334155;stroke-width:2}</style>
<text x="70" y="48" class="t">Temperature result view: synthetic nodal point cloud</text><text x="70" y="74" class="s">CSV schema: node_id, x_m, y_m, z_m, temperature_C; units displayed in C</text><line x1="100" y1="120" x2="1020" y2="120" class="grid"/><line x1="100" y1="210" x2="1020" y2="210" class="grid"/><line x1="100" y1="300" x2="1020" y2="300" class="grid"/><line x1="100" y1="390" x2="1020" y2="390" class="grid"/><line x1="100" y1="480" x2="1020" y2="480" class="grid"/><line x1="100" y1="570" x2="1020" y2="570" class="grid"/><line x1="100" y1="570" x2="1020" y2="570" class="axis"/><line x1="100" y1="120" x2="100" y2="570" class="axis"/><text x="520" y="630" class="a">x coordinate (m)</text><text x="20" y="350" class="a" transform="rotate(-90 20,350)">y / z coordinate (m)</text><circle cx="180.0" cy="370" r="22" fill="#dc2626"/><text x="145.0" y="420" class="a">node 1</text><text x="145.0" y="445" class="a">100.0 C</text><circle cx="530.0" cy="370" r="22" fill="#f59e0b"/><text x="495.0" y="420" class="a">node 2</text><text x="495.0" y="445" class="a">60.0 C</text><circle cx="880.0" cy="370" r="22" fill="#2563eb"/><text x="845.0" y="420" class="a">node 3</text><text x="845.0" y="445" class="a">20.0 C</text><rect x="720" y="150" width="70" height="25" fill="#dc2626"/><rect x="790" y="150" width="70" height="25" fill="#f59e0b"/><rect x="860" y="150" width="70" height="25" fill="#2563eb"/><text x="720" y="140" class="a">Temperature legend: hot to cold</text><text x="720" y="195" class="a">100 C       60 C        20 C</text></svg>